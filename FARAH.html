<head>

<style>
/* ===== style ===== */
:root{--ivory:#FAF8F3;--champ:#E9DDCA;--soft:#D8C3A5;--gold:#B69A70;--esp:#493B32;--white:#fff;--taupe:#A99A88;--en:"Cormorant Garamond",serif;--ar:"Amiri",serif;--arb:"IBM Plex Sans Arabic","Tajawal",sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ivory) radial-gradient(circle at 20% 0,#fff 0,transparent 50%);color:var(--esp);font:300 1.0625rem/1.9 "Cormorant Garamond",var(--arb);overflow-x:hidden;min-height:100vh}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] textarea{font-family:var(--arb)}
body.locked{overflow:hidden}
h1,h2,.names,.quote,.mono{font-family:var(--en);font-weight:300}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] .names,[dir=rtl] .quote,[dir=rtl] .mono{font-family:var(--ar);font-weight:400}
h2{font-size:clamp(1.9rem,6vw,3rem);text-align:center;margin-bottom:1.5rem;line-height:1.3}
h2::after{content:"";display:block;width:56px;height:1px;background:var(--gold);margin:.9rem auto 0}
section{padding:clamp(3.5rem,10vw,7rem) 1.25rem;max-width:960px;margin:auto;text-align:center}
.orn{color:var(--gold);font-size:1.8rem}
.btn,.link,.share,.lang button{cursor:pointer;font:500 .8rem/1 Inter,var(--arb);letter-spacing:.14em;border:1px solid var(--gold);background:transparent;color:var(--esp);padding:1rem 2rem;min-height:44px;text-decoration:none;display:inline-block;transition:.35s}
[dir=rtl] .btn,[dir=rtl] .share,[dir=rtl] .lang button{letter-spacing:0;font-size:.95rem}
.btn:hover,.btn:focus-visible{background:var(--esp);color:var(--ivory);border-color:var(--esp)}
.link{border:0;padding:.6rem;color:var(--taupe);letter-spacing:.05em}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;justify-content:space-between;padding:.75rem 1rem;pointer-events:none}
.bar>*{pointer-events:auto}.lang{display:flex;background:rgba(250,248,243,.85);backdrop-filter:blur(6px)}
.lang button,.share{padding:.55rem 1rem;border-color:var(--soft);background:rgba(250,248,243,.85)}.lang button.on{background:var(--esp);color:var(--ivory);border-color:var(--esp)}
#intro{position:fixed;inset:0;z-index:50;background:var(--champ);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1rem;transition:opacity .9s,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}#intro.opening .btn,#intro.opening .link,#intro.opening .eyebrow{opacity:0;pointer-events:none;transition:.5s}
.eyebrow{font:400 .8rem Inter,var(--arb);letter-spacing:.3em;color:var(--esp)}[dir=rtl] .eyebrow{letter-spacing:0;font-size:1.1rem;font-family:var(--ar)}
.env{position:relative;width:min(86vw,420px);aspect-ratio:1.5;background:linear-gradient(160deg,#EFE4D2,var(--soft));box-shadow:0 30px 60px -20px rgba(73,59,50,.45);border:1px solid var(--gold);perspective:900px;transition:transform 1.2s .9s}
.card{position:absolute;inset:6% 7%;background:var(--ivory);border:1px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.5rem;transition:transform 1.2s .7s cubic-bezier(.2,.8,.2,1);z-index:1}
.card .names{font-size:clamp(1.1rem,5vw,1.7rem);line-height:1.2}.small{font-size:.9rem;color:var(--taupe)}.card .dateLine{font-size:.85rem}
.flap{position:absolute;inset:0 0 auto 0;height:58%;background:linear-gradient(#E4D4BB,#D8C3A5);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s;z-index:3}
.env::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.6%,#E9DDCA 50.2%) bottom left/50% 55% no-repeat,linear-gradient(to bottom left,transparent 49.6%,#E9DDCA 50.2%) bottom right/50% 55% no-repeat;z-index:2;pointer-events:none}
.seal{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:4;width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--ivory);display:grid;place-items:center;font:500 1rem var(--en);box-shadow:0 0 0 3px var(--champ),0 0 0 4px var(--gold);transition:opacity .4s}
.env.open .flap{transform:rotateX(180deg);z-index:0}.env.open .seal{opacity:0}.env.open .card{transform:translateY(-62%) scale(1.12);z-index:5}.env.open{transform:translateY(12%)}
.hero{max-width:1100px;padding-top:5rem;display:grid;gap:2rem}
.frame{aspect-ratio:4/5;width:min(86%,460px);margin:auto;position:relative;overflow:hidden;outline:1px solid var(--gold);outline-offset:12px;background:var(--champ)}
.frame img,.g img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;border:1px dashed var(--taupe);color:var(--taupe);background:repeating-linear-gradient(45deg,var(--champ),var(--champ) 12px,#EFE6D6 12px,#EFE6D6 24px);font:.85rem Inter,var(--arb)}
h1{font-size:clamp(2.6rem,11vw,5.6rem);line-height:1.1}h1 span{display:block}.amp{display:block;font:italic 1.6rem "Playfair Display",serif;color:var(--gold);margin:.2rem 0}
.lead{max-width:34ch;margin:1rem auto;font-size:1.2rem}.dateLine{color:var(--gold);letter-spacing:.12em}[dir=rtl] .dateLine{letter-spacing:0}
.prose{max-width:52ch;margin:auto}.miles{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem 2rem;margin-top:1.5rem;color:var(--taupe)}
.miles li::before{content:"✦ ";color:var(--gold)}
.count{background:var(--esp);color:var(--ivory);max-width:none}.count h2{color:var(--ivory)}
.cd{display:flex;justify-content:center;gap:clamp(.5rem,3vw,2.5rem)}.cd div{min-width:64px;display:grid}
.cd b{font:300 clamp(2.4rem,11vw,5rem)/1 var(--en);font-variant-numeric:tabular-nums;color:var(--soft)}[dir=rtl] .cd b{font-family:var(--ar)}
.cd span{font-size:.85rem;opacity:.8}.done{font-size:1.5rem;color:var(--soft)}
dl{display:grid;gap:1.6rem;margin:1rem 0 2.2rem}dt{font:500 .72rem Inter,var(--arb);letter-spacing:.25em;color:var(--gold)}[dir=rtl] dt{letter-spacing:0;font-size:.95rem}dd{font:300 1.6rem/1.4 var(--en)}[dir=rtl] dd{font-family:var(--ar)}
.tl{max-width:640px}.tl ol{list-style:none;position:relative;text-align:start}.tl ol::before{content:"";position:absolute;inset-block:0;inset-inline-start:21px;width:1px;background:var(--soft)}
.tl li{position:relative;padding-inline-start:64px;padding-bottom:2rem}.tl .ic{position:absolute;inset-inline-start:0;top:0;width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;background:var(--ivory);display:grid;place-items:center;color:var(--gold)}
.tl time{font:500 .8rem Inter;color:var(--gold);letter-spacing:.1em}.tl h3{font:400 1.5rem/1.3 var(--en)}[dir=rtl] .tl h3{font-family:var(--ar)}.tl p{color:var(--taupe);line-height:1.6}
.gal{max-width:1100px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.g{border:0;padding:0;cursor:zoom-in;overflow:hidden;background:var(--champ);aspect-ratio:4/5;position:relative}.g:disabled{cursor:default}.g img{transition:transform 1s}.g:hover img{transform:scale(1.05)}
.rsvp{max-width:540px;text-align:start}.rsvp form{display:grid;gap:.5rem}.rsvp label,legend{font-weight:500;margin-top:.8rem}em{color:var(--gold);font-style:normal}
input:not([type=radio]),textarea{width:100%;padding:.85rem 1rem;font:inherit;font-size:1rem;color:var(--esp);background:var(--white);border:1px solid var(--soft);border-radius:0}
input:focus,textarea:focus{border-color:var(--gold);outline:2px solid rgba(182,154,112,.35)}
fieldset{border:0;padding:0;display:grid;gap:.5rem}.opt{display:flex;gap:.7rem;align-items:center;margin:0;padding:.8rem 1rem;border:1px solid var(--soft);background:var(--white);cursor:pointer;min-height:48px}
.opt input{accent-color:var(--gold);width:18px;height:18px}.opt:has(input:checked){border-color:var(--gold);background:var(--champ)}
.err{color:#9b3d2e;min-height:1.2em;font-size:.9rem}#send{margin-top:1rem;background:var(--esp);color:var(--ivory)}#send:disabled{opacity:.6}.ok{padding:1rem;border:1px solid var(--gold);background:var(--champ);text-align:center}
.final{padding-bottom:8rem}.quote{font-size:clamp(1.6rem,6vw,2.6rem);line-height:1.5;max-width:22ch;margin:1rem auto}.mono{font-size:2.4rem;color:var(--gold);margin:1rem 0}
.music{position:fixed;inset-block-end:1rem;inset-inline-end:1rem;z-index:30;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:var(--ivory);display:flex;gap:3px;align-items:center;justify-content:center;cursor:pointer}
.music[hidden],.lb[hidden]{display:none}
.music i{width:2px;height:8px;background:var(--gold)}.music.on i{animation:eq .9s infinite ease-in-out}.music.on i:nth-child(2){animation-delay:.2s}.music.on i:nth-child(3){animation-delay:.4s}
.lb{position:fixed;inset:0;z-index:80;background:rgba(40,32,27,.96);display:flex;align-items:center;justify-content:center;flex-direction:column}
.lb img{max-width:92vw;max-height:80vh;object-fit:contain}.lb p{color:var(--soft);margin-top:.8rem}.lb button{position:absolute;background:none;border:0;color:#fff;font-size:2.6rem;cursor:pointer;width:56px;height:56px}
.x{top:.5rem;right:.5rem}.pv{left:.3rem}.nx{right:.3rem}

/* ===== animations ===== */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s,transform 1s}.rv.in{opacity:1;transform:none}
.hero .frame{animation:reveal 1.8s cubic-bezier(.2,.8,.2,1) both}.hero .frame img{animation:zoom 14s ease-out both}
.heroText{animation:fade 1.6s .5s both}
.tick{animation:tick .45s}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
@keyframes tick{from{opacity:.3;transform:translateY(-8px)}}
@keyframes eq{50%{height:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

/* ===== rapunzel ===== */
:root{--night:#2a1f4d;--violet:#5b3f93;--lav:#c9b8ec;--glow:#ffd98a}
body{background:linear-gradient(#FFF9EC,#F7EFFA 50%,#FFF6E0) fixed}
h2{color:var(--night)}.sun{width:46px;height:46px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round}
.hero{background:radial-gradient(circle at 50% 25%,rgba(255,217,138,.4),transparent 60%)}
.hero h1,.card .names,.final .mono{font-family:"Great Vibes",cursive;font-weight:400;color:var(--night)}
.hero h1{font-size:clamp(3.2rem,14vw,6.8rem);line-height:1.15}.final .mono{font-size:3.2rem}
[dir=rtl] .hero h1,[dir=rtl] .card .names,[dir=rtl] .final .mono{font-family:var(--ar);font-weight:700}
[dir=rtl] .hero h1{font-size:clamp(2.8rem,12vw,5.6rem)}
.count{background:linear-gradient(#2a1f4d,#4a3470)}.count h2{color:#fff0c8}.cd b{color:var(--glow);text-shadow:0 0 18px rgba(255,217,138,.55)}
.tl .ic,.seal{box-shadow:0 0 14px rgba(255,217,138,.45)}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.music{z-index:70}body.locked .hero *{animation-play-state:paused}
/* royal envelope + cinematic intro */
#intro{overflow:hidden;background:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 72%,#fff,transparent),radial-gradient(1.4px 1.4px at 44% 30%,#ffe9b0,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.3px 1.3px at 78% 58%,#fff,transparent),radial-gradient(1px 1px at 90% 26%,#ffe9b0,transparent),radial-gradient(1px 1px at 8% 80%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 88%,#fff,transparent),radial-gradient(ellipse at 50% 105%,rgba(255,170,90,.45),transparent 55%),linear-gradient(#1b1340,#35266b 65%,#6a4b9c);transition:opacity 1.6s,visibility 1.6s}
#intro::after{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 42%,rgba(255,226,160,.95),rgba(255,226,160,0) 65%);opacity:0;transition:opacity 2.4s;pointer-events:none}
#intro.glow::after{opacity:1}#intro>*{position:relative;z-index:1}
.eyebrow{color:#f3e6c4}.hint{color:var(--lav);font:.85rem Inter,var(--arb);animation:pulse 2.4s infinite}[dir=rtl] .hint{font-size:1rem}
#intro .btn{color:#f3e6c4;border-color:#d9b977;background:rgba(255,255,255,.06)}#intro .btn:hover,#intro .btn:focus-visible{background:var(--glow);color:var(--night)}#intro .link{color:var(--lav)}
.env{cursor:pointer;background:linear-gradient(160deg,#5b3f93,#33225e);border-color:#d9b977;animation:bob 5s ease-in-out infinite;transition:transform 2s .4s;box-shadow:0 30px 70px -20px rgba(0,0,0,.6),inset 0 0 0 7px #33225e,inset 0 0 0 8px rgba(217,185,119,.7)}
.env::after{background:linear-gradient(to bottom right,transparent 49.6%,rgba(217,185,119,.85) 49.8%,#4a3478 50.2%) bottom left/50% 55% no-repeat,linear-gradient(to bottom left,transparent 49.6%,rgba(217,185,119,.85) 49.8%,#4a3478 50.2%) bottom right/50% 55% no-repeat}
.flap{background:linear-gradient(#6c4fa6,#4a3478)}.seal{background:radial-gradient(circle at 35% 30%,#ffe9a8,#c99a3e 70%);color:#4a3478;box-shadow:0 0 0 3px #33225e,0 0 0 4px #d9b977,0 0 22px rgba(255,217,138,.6)}
.env.open{animation:none}.env.open .flap{transition:transform 1.8s cubic-bezier(.4,0,.2,1)}
.env.open .card{transform:none;z-index:1}
#intro.glow .card{z-index:5;transform:translateY(-68%) scale(1.4);box-shadow:0 0 70px 24px rgba(255,217,138,.7);transition:transform 2.6s,box-shadow 2.6s,z-index 0s 1s}
#intro.opening .hint{opacity:0}
@keyframes bob{50%{translate:0 -8px}}@keyframes pulse{50%{opacity:.4}}

/* ===== responsive ===== */
@media (max-width:360px){.btn{padding:.9rem 1.2rem}.cd div{min-width:54px}.seal{width:52px;height:52px}.share{padding:.5rem .7rem}}
@media (min-width:700px){.grid{grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:.8rem}.g{aspect-ratio:auto}
 .g0{grid-column:span 3;grid-row:span 3}.g1,.g2{grid-column:span 3;grid-row:span 2}.g3,.g4,.g5{grid-column:span 2;grid-row:span 2}
 dl{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.hero{grid-template-columns:1fr 1fr;align-items:center;min-height:100vh;gap:4rem}.frame{width:min(100%,480px)}}
/* phones & dynamic viewport */
html{-webkit-tap-highlight-color:transparent}
.bar{padding-top:max(.75rem,env(safe-area-inset-top));padding-inline:max(1rem,env(safe-area-inset-left))}
.music{inset-block-end:max(1rem,env(safe-area-inset-bottom))}
@media (max-width:600px){.hero{min-height:100svh;align-content:center;padding-top:5.5rem}.frame{width:min(78%,360px)}section{padding-inline:1rem}.cd{gap:.4rem}.cd div{min-width:0;flex:1}dd{font-size:1.35rem}.share{font-size:.8rem}}
@media (max-width:520px){#intro.glow .card{transform:translateY(-68%) scale(1.1)}}
@media (max-height:520px) and (orientation:landscape){.env{width:min(78vh,56vw)}.eyebrow,.hint{display:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sun" viewBox="0 0 48 48"><circle cx="24" cy="24" r="6"/><circle cx="24" cy="24" r="11" stroke-dasharray="2 3"/><path d="M24 3v10M24 35v10M3 24h10M35 24h10M9 9l7 7M32 32l7 7M39 9l-7 7M16 32l-7 7"/></symbol></svg>
<canvas id="sky" aria-hidden="true"></canvas>

    <div class="flap"></div><div class="seal" data-initials></div>

<header class="bar">
  <div class="lang" role="group" aria-label="Language"><button data-lang="ar" class="on">عربي</button><button data-lang="en">EN</button></div>

<main>
<section class="hero" id="top">
  <figure class="frame" data-photo="couple"></figure>

    <h1><span data-name="bride"></span><i class="amp">&amp;</i><span data-name="groom"></span></h1>

</section>

<section class="story">

  <h2 data-i18n="storyH"></h2>
  <p class="prose" data-i18n="storyP"></p>
  <ul class="miles" id="miles"></ul>
</section>

<section class="count" aria-live="off">
  <h2 data-i18n="countH"></h2>
  <div class="cd" id="cd">
    <div><b id="cdD">0</b><span data-i18n="days"></span></div><div><b id="cdH">0</b><span data-i18n="hours"></span></div>
    <div><b id="cdM">0</b><span data-i18n="mins"></span></div><div><b id="cdS">0</b><span data-i18n="secs"></span></div>
  </div>

<section class="details">
  <h2 data-i18n="detailsH"></h2>

    <div><dt data-i18n="date"></dt><dd data-date="long"></dd></div>
    <div><dt data-i18n="time"></dt><dd data-time></dd></div>
    <div><dt data-i18n="venue"></dt><dd data-cfg="venueName"></dd></div>
    <div><dt data-i18n="address"></dt><dd data-cfg="venueAddress"></dd></div>
  </dl>
  <a class="btn" id="mapBtn" target="_blank" rel="noopener" data-i18n="directions"></a>

/* ===== countdown ===== */
(function(){
  const els = {D:cdD,H:cdH,M:cdM,S:cdS};
  function set(k,v){ const s = v.toLocaleString(loc(),{useGrouping:false}); if(els[k].textContent!==s){ els[k].textContent=s; els[k].classList.remove("tick"); void els[k].offsetWidth; els[k].classList.add("tick"); } }
  function tick(){
    const diff = Math.max(0, ORD - new Date());
    const s = Math.floor(diff/1000);
    set("D",Math.floor(s/86400)); set("H",Math.floor(s%86400/3600)); set("M",Math.floor(s%3600/60)); set("S",s%60);
    const over = diff === 0; cd.hidden = over; cdDone.hidden = !over;
    if(over) cdDone.textContent = t(weddingConfig.afterEvent === "celebrating" ? "celebrating" : "ended");
  }
  document.addEventListener("langchange", tick); setInterval(tick,1000); tick();
})();

/* ===== gallery ===== */
(function(){
  const cfg = weddingConfig, items = cfg.galleryImages;
  let cur = 0, valid = [];
  function ph(el){ el.classList.add("ph"); el.innerHTML = `<span>${t("placeholder")}</span>`; }
  function photo(el, src){ if(!src){ ph(el); return; } const i = new Image(); i.alt = ""; i.decoding = "async"; i.onerror = () => ph(el); i.src = src; el.appendChild(i); }
  function build(){
    document.querySelectorAll("[data-photo=couple]").forEach(f => { f.className = "frame"; f.innerHTML = ""; photo(f, cfg.coupleImages[0]); });
    grid.innerHTML = ""; valid = [];
    const list = items.length ? items : Array.from({length:6}, () => ({src:""}));
    list.forEach((g, i) => {
      const b = document.createElement("button"); b.className = "g g" + (i % 6); b.setAttribute("aria-label", "Photo " + (i + 1));
      photo(b, g.src); if(g.src){ const k = valid.push(g) - 1; b.onclick = () => show(k); } else b.disabled = true;
      grid.appendChild(b);

  function show(i){ cur = (i + valid.length) % valid.length; const g = valid[cur]; lb.hidden = false; lbImg.src = g.src; lbCap.textContent = g.caption ? g.caption[LANG] || "" : ""; lbX.focus(); }

(function(){

    let ok = true; const g = +f.guests.value;

    eAtt.textContent = f.att.value ? "" : (ok = false, t("eAtt"));
    eGuests.textContent = (g >= 1 && g <= 10) ? "" : (ok = false, t("eGuests"));
    return ok;
  }
  f.addEventListener("submit", async e => {
    e.preventDefault(); ok.hidden = true; if(!validate()) return;
    const data = {name:f.name.value.trim(), attending:f.att.value === "yes", guests:+f.guests.value, message:f.msg.value.trim()};
    send.disabled = true; send.firstElementChild.textContent = t("sending");
    try{
      /* BACKEND INTEGRATION POINT: POST JSON to weddingConfig.rsvpEndpoint */
      if(weddingConfig.rsvpEndpoint){
        const r = await fetch(weddingConfig.rsvpEndpoint, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
        if(!r.ok) throw new Error(r.status);
      } else await new Promise(r => setTimeout(r, 700));
      ok.textContent = t(data.attending ? "okYes" : "okNo") + (weddingConfig.rsvpEndpoint ? "" : t("demo")); ok.hidden = false; f.reset(); f.guests.value = 1;
    }catch(err){ ok.textContent = t("fail"); ok.hidden = false; }
    send.disabled = false; send.firstElementChild.textContent = t("send");
  });
  f.addEventListener("input", () => { if(eName.textContent || eAtt.textContent || eGuests.textContent) validate(); });
})();

/* ===== music ===== */
/* Original soft romantic melody, generated live with Web Audio (no file, no copyright issues).
   To use your own track instead, set backgroundMusic in config.js. Starts only after a user click. */
(function(){
  const AC=window.AudioContext||window.webkitAudioContext,file=weddingConfig.backgroundMusic;
  let ctx,master,rev,el,on=false,started=false,next=0,bar=0;
  const BEAT=.85,mf=m=>440*Math.pow(2,(m-69)/12);
  const CH=[[50,57,62,66],[45,52,57,61],[47,54,59,62],[43,50,55,59]],ORDER=[0,1,2,3,3,0,1,0],ARP=[0,2,1,3,2,3,1,2];
  const MEL=[[[0,78],[1.5,74],[2.5,76],[3,78]],[[0,73],[1.5,76],[2.5,78]],[[0,74],[1.5,78],[2.5,81]],[[0,79],[1.5,78],[2.5,74],[3,76]]];
  function tone(m,t,d,type,v,a){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=mf(m);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+d+.1)}
  function playBar(t,b){const i=ORDER[b%8],c=CH[i];
    c.forEach(m=>tone(m,t,4*BEAT+2,"sine",.035,1.6));
    ARP.forEach((k,j)=>tone(c[k]+12,t+j*BEAT/2,2.4,"triangle",.07,.02));
    if(b%8<4)MEL[i].forEach(([bt,m])=>{tone(m,t+bt*BEAT,3,"sine",.09,.02);tone(m+12,t+bt*BEAT,1.6,"sine",.02,.01)})}
  function reverb(){const n=ctx.sampleRate*3,b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}
    const cv=ctx.createConvolver(),w=ctx.createGain();cv.buffer=b;w.gain.value=.55;cv.connect(w);w.connect(master);return cv}
  function sched(){while(next<ctx.currentTime+3){playBar(next,bar++);next+=4*BEAT}setTimeout(sched,800)}
  function gen(){if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);rev=reverb();next=ctx.currentTime+.2;sched()}
  function setOn(v){on=v;music.classList.toggle("on",v);music.setAttribute("aria-pressed",v);
    if(el){v?el.play().catch(()=>{}):el.pause()}
    else if(ctx){ctx.resume();master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(v?.8:0,ctx.currentTime,v?1.5:.15)}}

    if(file){el=new Audio(file);el.loop=true;el.volume=.7;el.onerror=()=>{el=null;gen();setOn(on)}}else gen();
    setOn(true)}
  music.hidden=false;
  music.onclick=()=>started?setOn(!on):begin();            // mute / unmute button
  window.startMusic=()=>{started?(!on&&setOn(true)):begin()};
  document.addEventListener("visibilitychange",()=>{if(ctx)document.hidden?ctx.suspend():on&&ctx.resume()});
})();

(function(){

  function startScene(env,cb){if(calm){setTimeout(cb,300);return}

    sc.ex=Math.min(W*.5+base*110,W-base*42)}

/* ===== main ===== */
(function(){
  function renderStatic(){
    miles.innerHTML = weddingConfig.story.map(s => `<li>${s[LANG]}</li>`).join("");
    tl.innerHTML = weddingConfig.timeline.map(e => { const c = e[LANG]; return `<li><span class="ic" aria-hidden="true">${e.icon}</span><time>${e.time}</time><h3>${c[0]}</h3><p>${c[1]}</p></li>`; }).join("");
    const u = weddingConfig.mapsUrl; mapBtn.href = /^https?:/.test(u) ? u : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(weddingConfig.venueName.en + " " + weddingConfig.venueAddress.en);
  }
  document.addEventListener("langchange", renderStatic);
  applyLang(LANG); window.buildGallery();
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => applyLang(b.dataset.lang));
  shareBtn.onclick = () => { const txt = I18N[LANG].shareMsg(nm("bride") + " & " + nm("groom"), fmtDate(true), weddingConfig.invitationUrl); window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank", "noopener"); };
  let T = [], opened = false; const at = (f, ms) => T.push(setTimeout(f, ms));

    at(() => FX.startScene(env, () => { const p = FX.hands(); intro.classList.add("glow"); FX.burst(p.x, p.y, 70); FX.butterflies(p.x, p.y);
      at(() => FX.fadeButterflies(), 3800); at(() => FX.light(p.x, p.y, enter), 4000); }), 1700); }
  openBtn.onclick = openInvite; env.onclick = openInvite;
  env.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openInvite(); } };
  skipBtn.onclick = enter;
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && (e.target.classList.add("in"), io.unobserve(e.target))), {threshold:.15});
  document.querySelectorAll("section:not(.hero)").forEach(s => { s.classList.add("rv"); io.observe(s); });
